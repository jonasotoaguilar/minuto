name: Feature Request
description: Suggest a new feature or improvement for Minuto
title: "[Feature]: "
labels: ["type:feature", "status:needs-review"]

body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Minuto better? Describe it below. Issues start with `status:needs-review`; a maintainer must add `status:approved` before implementation PRs can pass validation.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight Checklist
      options:
        - label: I checked existing issues and this is not a duplicate.
          required: true
        - label: I understand PRs must link an issue with `status:approved`.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? Is it related to a frustration?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
      placeholder: "I'd like to be able to..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered other approaches? What are the tradeoffs?
      placeholder: "I also thought about..."
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      description: Which part of Minuto does this affect?
      multiple: true
      options:
        - Authentication / Onboarding
        - Attendance Control
        - Team Management
        - Member Profile
        - UI / Design System
        - Supabase / Database
        - Build / Tooling
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Target Platform
      description: Which platform(s) should this feature target?
      multiple: true
      options:
        - iOS
        - Android
        - Web
        - All platforms
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: What must be true for this feature to be considered done?
      placeholder: |
        - [ ] Users can...
        - [ ] The system prevents...
        - [ ] Tests cover...
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Links, screenshots, sketches, or related issues.
    validations:
      required: false
