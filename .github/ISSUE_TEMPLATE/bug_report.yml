name: Bug Report
description: Report a bug or unexpected behavior in Minuto
title: "[Bug]: "
labels: ["type:bug", "status:needs-review"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Issues start with `status:needs-review`; a maintainer must add `status:approved` before a PR can be opened, otherwise PR validation will fail.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight Checklist
      options:
        - label: I checked existing issues and this is not a duplicate.
          required: true
        - label: I understand PRs must link an issue with `status:approved`.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the bug.
      placeholder: |
        1. Go to '...'
        2. Tap on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: I expected...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Instead, what happened was...
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which platform(s) does this affect?
      multiple: true
      options:
        - iOS
        - Android
        - Web
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      description: Which part of Minuto is affected?
      multiple: true
      options:
        - Authentication / Onboarding
        - Attendance Control
        - Team Management
        - Member Profile
        - UI / Design System
        - Supabase / Database
        - Build / Tooling
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: expo-version
    attributes:
      label: Expo SDK Version
      description: Check package.json or app runtime info.
      placeholder: "55.x"
    validations:
      required: false

  - type: input
    id: device
    attributes:
      label: Device / Browser
      description: "Example: iPhone 15 Pro, Pixel 8 emulator, Chrome 120."
      placeholder: "iPhone 15 Pro"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Output
      description: Paste relevant logs or error messages.
      render: shell
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Screen Recordings
      description: Drag and drop images or videos that help illustrate the bug.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Workarounds tried, related issues, or anything else that helps.
    validations:
      required: false
